<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دنیای خلاقیت | صفحه اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.75rem;
            margin-bottom: 20px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: #94a3b8;
            margin-bottom: 36px;
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .btn-primary:hover {
            background: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .meta-info {
            margin-top: 50px;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: right;
            direction: ltr;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">دنیای خلاقیت</div>
    </header>

    <main>
        <h1>ایده‌هایت را به واقعیت تبدیل کن</h1>
        <p class="subtitle">با ابزارها و فرآیندهای نوین، طرح‌ها و پروژه‌های خود را سریع‌تر، زیباتر و قدرتمندتر از همیشه پیاده‌سازی کنید.</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">شروع کنید</a>
            <a href="#" class="btn btn-secondary">بیشتر بدانید</a>
        </div>

        <div class="meta-info">
            <!-- Source from stream-test.txt: Streaming works correctly. / File created by the AI agent. / Live coding test passed. -->
            Stream-test reference: Live coding test passed.
        </div>
    </main>

    <footer>
        تمامی حقوق محفوظ است &copy; 1403
    </footer>

</body>
</html>
